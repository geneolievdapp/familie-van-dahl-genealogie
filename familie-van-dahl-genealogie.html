<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Familie van Dahl – Genealogie (Erweiterte Version)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{
      --color-bg:#f7f6f2;
      --color-surface:#faf9f6;
      --color-surface-2:#fcfbf9;
      --color-surface-offset:#f3f0ec;
      --color-divider:#e0ded9;
      --color-border:#d4d1ca;
      --color-text:#28251d;
      --color-text-muted:#7a7974;
      --color-text-faint:#bab9b4;
      --color-primary:#964219;
      --color-primary-hover:#713417;
      --color-primary-active:#4b2614;
      --color-success:#437a22;
      --color-error:#a12c7b;
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
      --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
      --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --space-1:.25rem;
      --space-2:.5rem;
      --space-3:.75rem;
      --space-4:1rem;
      --space-6:1.5rem;
      --space-8:2rem;
      --space-12:3rem;
      --space-16:4rem;
      --radius-sm:.375rem;
      --radius-md:.5rem;
      --radius-lg:.75rem;
      --radius-full:9999px;
      --shadow-sm:0 1px 2px oklch(.2 .01 80 / .06);
      --shadow-md:0 4px 12px oklch(.2 .01 80 / .08);
      --shadow-lg:0 12px 32px oklch(.2 .01 80 / .12);
      --font-body:'General Sans',-apple-system,sans-serif
    }
    [data-theme="dark"]{
      --color-bg:#171614;
      --color-surface:#1c1b19;
      --color-surface-2:#201f1d;
      --color-surface-offset:#1d1c1a;
      --color-divider:#262523;
      --color-border:#393836;
      --color-text:#cdccca;
      --color-text-muted:#797876;
      --color-text-faint:#5a5957;
      --color-primary:#bb653b;
      --color-primary-hover:#b95525;
      --color-primary-active:#993d10;
      --color-success:#6daa45;
      --color-error:#d163a7;
      --shadow-sm:0 1px 2px oklch(0 0 0 / .2);
      --shadow-md:0 4px 12px oklch(0 0 0 / .3);
      --shadow-lg:0 12px 32px oklch(0 0 0 / .4)
    }
    @media(prefers-color-scheme:dark){
      :root:not([data-theme]){
        --color-bg:#171614;
        --color-surface:#1c1b19;
        --color-surface-2:#201f1d;
        --color-surface-offset:#1d1c1a;
        --color-divider:#262523;
        --color-border:#393836;
        --color-text:#cdccca;
        --color-text-muted:#797876;
        --color-text-faint:#5a5957;
        --color-primary:#bb653b;
        --color-primary-hover:#b95525;
        --color-primary-active:#993d10;
        --color-success:#6daa45;
        --color-error:#d163a7;
        --shadow-sm:0 1px 2px oklch(0 0 0 / .2);
        --shadow-md:0 4px 12px oklch(0 0 0 / .3);
        --shadow-lg:0 12px 32px oklch(0 0 0 / .4)
      }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:none}
    body{font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background-color:var(--color-bg);line-height:1.6;min-height:100vh;overflow-x:hidden}
    .app-container{max-width:1200px;margin:0 auto;padding:var(--space-4)}
    header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:var(--space-4);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
    .header-content{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap}
    h1{font-size:var(--text-xl);font-weight:700;color:var(--color-primary);display:flex;align-items:center;gap:var(--space-2)}
    .header-actions{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
    .btn{padding:var(--space-2) var(--space-4);background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:600;cursor:pointer;transition:all 180ms cubic-bezier(.16,1,.3,1);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);white-space:nowrap}
    .btn:active{transform:scale(.96);background:var(--color-primary-active)}
    .btn-secondary{background:var(--color-surface-offset);color:var(--color-text)}
    .btn-secondary:active{background:var(--color-divider)}
    .btn-danger{background:var(--color-error)}
    .btn-danger:active{background:#7d1e5e}
    .btn-small{padding:var(--space-1) var(--space-2);font-size:var(--text-xs);min-height:32px}
    .theme-toggle{background:var(--color-surface-offset);width:44px;height:44px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:var(--color-text)}
    nav{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-2);margin:var(--space-6) 0;display:flex;gap:var(--space-2);overflow-x:auto;-webkit-overflow-scrolling:touch}
    .nav-btn{padding:var(--space-3) var(--space-4);background:0 0;color:var(--color-text-muted);border:none;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px;transition:all 180ms}
    .nav-btn.active{background:var(--color-primary);color:#fff}
    .view{display:none}
    .view.active{display:block}
    .search-box{position:relative;margin-bottom:var(--space-4)}
    .search-box input{padding-left:var(--space-12)}
    .search-icon{position:absolute;left:var(--space-3);top:50%;transform:translateY(-50%);color:var(--color-text-muted)}
    input,select,textarea{width:100%;padding:var(--space-3);background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-base);color:var(--color-text);font-family:var(--font-body);min-height:44px}
    textarea{min-height:100px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--color-primary);outline-offset:2px}
    input[type="checkbox"]{width:auto;min-height:auto}
    .checkbox-label{display:flex;align-items:center;gap:var(--space-2);cursor:pointer}
    .person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:var(--space-4);margin-top:var(--space-6)}
    .person-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:all 180ms}
    .person-card:active{transform:scale(.98);box-shadow:var(--shadow-md)}
    .person-header{display:flex;gap:var(--space-3);align-items:flex-start;margin-bottom:var(--space-3)}
    .avatar{width:48px;height:48px;border-radius:var(--radius-full);background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--text-lg);color:#fff;flex-shrink:0}
    .person-name{font-size:var(--text-lg);font-weight:600;margin-bottom:var(--space-1)}
    .person-dates{font-size:var(--text-sm);color:var(--color-text-muted)}
    .person-meta{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:var(--space-2)}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:oklch(0 0 0 /.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:var(--space-4);overflow-y:auto;-webkit-overflow-scrolling:touch}
    .modal.active{display:flex}
    .modal-content{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);max-width:700px;width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lg)}
    .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--space-4)}
    .modal-title{font-size:var(--text-xl);font-weight:700;color:var(--color-primary)}
    .close-btn{background:var(--color-surface-offset);border:none;width:36px;height:36px;border-radius:var(--radius-full);cursor:pointer;font-size:20px;color:var(--color-text-muted)}
    .detail-section{margin-bottom:var(--space-4)}
    .detail-label{font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);margin-bottom:var(--space-2);text-transform:uppercase;letter-spacing:.5px}
    .detail-value{font-size:var(--text-base);color:var(--color-text)}
    .chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
    .chip{padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);font-size:var(--text-xs);background:var(--color-surface-offset);cursor:pointer}
    .chips .chip:active{transform:scale(.96)}
    .form-group{margin-bottom:var(--space-4)}
    label{display:block;font-size:var(--text-sm);font-weight:600;color:var(--color-text);margin-bottom:var(--space-2)}
    .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-4)}
    .partnership-item{background:var(--color-surface-offset);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2)}
    .partnership-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-2)}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:var(--space-4);margin-top:var(--space-6)}
    .stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);text-align:center}
    .stat-value{font-size:var(--text-xl);font-weight:700;color:var(--color-primary);margin-bottom:var(--space-2)}
    .stat-label{font-size:var(--text-sm);color:var(--color-text-muted)}
    .timeline{margin-top:var(--space-6)}
    .timeline-group{margin-bottom:var(--space-8)}
    .timeline-decade{font-size:var(--text-lg);font-weight:700;color:var(--color-primary);margin-bottom:var(--space-4);padding-bottom:var(--space-2);border-bottom:2px solid var(--color-border)}
    .timeline-event{padding:var(--space-3);background:var(--color-surface);border-left:3px solid var(--color-primary);margin-bottom:var(--space-3);border-radius:var(--radius-sm);cursor:pointer;transition:all 180ms}
    .timeline-event:active{transform:translateX(4px)}
    .tree-container{margin-top:var(--space-6);overflow-x:auto;padding-bottom:var(--space-4)}
    .tree-level{display:flex;justify-content:center;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap}
    .tree-node{min-width:180px;max-width:220px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3);text-align:center;cursor:pointer;box-shadow:var(--shadow-sm)}
    .tree-node:active{transform:scale(.97);box-shadow:var(--shadow-md)}
    .tree-name{font-weight:600;margin-bottom:var(--space-1)}
    .tree-years{font-size:var(--text-sm);color:var(--color-text-muted)}
    .tree-links{width:100%;text-align:center;margin-bottom:var(--space-2);color:var(--color-text-faint);font-size:var(--text-xs)}
    .empty-state{text-align:center;padding:var(--space-16) var(--space-4);color:var(--color-text-muted)}
    .storage-status{position:fixed;bottom:var(--space-4);right:var(--space-4);background:var(--color-success);color:#fff;padding:var(--space-3) var(--space-4);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:opacity 300ms;pointer-events:none;z-index:2000}
    .storage-status.show{opacity:1}
    @media(max-width:768px){
      .header-content{flex-direction:column;align-items:stretch}
      .header-actions{justify-content:center}
      nav{justify-content:flex-start}
    }
  </style>
</head>
<body>
<header>
  <div class="header-content">
    <h1>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Familie van Dahl
    </h1>
    <div class="header-actions">
      <button class="btn" onclick="app.showAddModal()">+ Person</button>
      <button class="btn btn-secondary" onclick="app.exportJSON()">📥 Export</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📤 Import</button>
      <button class="theme-toggle" data-theme-toggle aria-label="Theme umschalten">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<input type="file" id="importFile" accept=".json" style="display:none" onchange="app.importJSON(event)">

<div class="app-container">
  <nav>
    <button class="nav-btn active" onclick="app.switchView(event,'persons')">Personen</button>
    <button class="nav-btn" onclick="app.switchView(event,'timeline')">Zeitleiste</button>
    <button class="nav-btn" onclick="app.switchView(event,'stats')">Statistiken</button>
    <button class="nav-btn" onclick="app.switchView(event,'tree')">Stammbaum</button>
  </nav>

  <div id="personsView" class="view active">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Nach Name, Ort oder Beruf suchen..." oninput="app.searchPersons(this.value)">
    </div>
    <div id="personGrid" class="person-grid"></div>
  </div>

  <div id="timelineView" class="view">
    <div id="timelineContent" class="timeline"></div>
  </div>

  <div id="statsView" class="view">
    <div id="statsContent" class="stats-grid"></div>
  </div>

  <div id="treeView" class="view">
    <div id="treeContent" class="tree-container"></div>
  </div>
</div>

<div id="personModal" class="modal" onclick="if(event.target===this) app.closeModal()">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle"></h2>
      <button class="close-btn" onclick="app.closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-4);justify-content:flex-end;">
      <button class="btn btn-danger" onclick="app.deleteCurrent()">Löschen</button>
      <button class="btn btn-secondary" onclick="app.startEdit()">Bearbeiten</button>
    </div>
  </div>
</div>

<div id="editModal" class="modal" onclick="if(event.target===this) app.closeEditModal()">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="editModalTitle">Person bearbeiten</h2>
      <button class="close-btn" onclick="app.closeEditModal()">×</button>
    </div>
    <form id="editPersonForm"></form>
  </div>
</div>

<div id="addModal" class="modal" onclick="if(event.target===this) app.closeAddModal()">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Person hinzufügen</h2>
      <button class="close-btn" onclick="app.closeAddModal()">×</button>
    </div>
    <form id="addPersonForm"></form>
  </div>
</div>

<div class="storage-status" id="storageStatus">Daten gespeichert ✓</div>

<script>
const app = {
  db:null,
  persons:[],
  currentId:null,

  async init(){
    await this.initDB();
    await this.loadData();
    if(this.persons.length===0){ this.loadSampleData(); }
    this.renderPersons();
    this.initTheme();
    this.buildForms();
  },

  async initDB(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open('VanDahlGenealogy',1);
      req.onerror=()=>reject(req.error);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('persons')){
          const os=db.createObjectStore('persons',{keyPath:'id',autoIncrement:true});
          os.createIndex('lastName','lastName',{unique:false});
        }
      };
      req.onsuccess=()=>{ this.db=req.result; resolve(); };
    });
  },

  async loadData(){
    return new Promise((resolve,reject)=>{
      const tx=this.db.transaction(['persons'],'readonly');
      const os=tx.objectStore('persons');
      const req=os.getAll();
      req.onsuccess=()=>{ this.persons=req.result; resolve(); };
      req.onerror=()=>reject(req.error);
    });
  },

  async saveAll(){
    const tx=this.db.transaction(['persons'],'readwrite');
    const os=tx.objectStore('persons');
    os.clear();
    this.persons.forEach(p=>os.put(p));
    return new Promise(res=>{
      tx.oncomplete=()=>{ this.showStorageStatus(); res(); };
    });
  },

  loadSampleData(){
    this.persons=[
      {id:1,firstName:'Vandalem',lastName:'van Dahl',gender:'M',birthDate:'1760',birthPlace:'Flandern',partnerships:[],notes:'Stammvater der Familie, ca. 1760 in Flandern geboren'},
      {id:2,firstName:'Leopold',lastName:'van Dahl',gender:'M',birthDate:'1788-03-15',birthPlace:'Oudenaarde, Belgien',deathDate:'1852-08-20',deathPlace:'Berlin',occupation:'Kaufmann',fatherId:1,partnerships:[]},
      {id:3,firstName:'Ludwig',lastName:'van Dahl',gender:'M',birthDate:'1816-06-12',birthPlace:'Berlin',deathDate:'1889-11-30',deathPlace:'Berlin',occupation:'Fabrikant',fatherId:2,partnerships:[]}
    ];
    this.saveAll();
  },

  personLabel(p){
    return p ? `${p.firstName} ${p.lastName}` : '';
  },

  renderPersons(list){
    const persons=list || this.persons;
    const grid=document.getElementById('personGrid');
    if(!persons.length){
      grid.innerHTML='<div class="empty-state"><p>Noch keine Personen eingetragen</p></div>';
      return;
    }
    grid.innerHTML=persons.map(p=>{
      const initials=(p.firstName?.[0]||'')+(p.lastName?.[0]||'');
      const by=p.birthDate||'?';
      const dy=p.deathDate||'';
      const span=dy?`${by}–${dy}`:`*${by}`;
      return `
      <div class="person-card" onclick="app.showPersonDetail(${p.id})">
        <div class="person-header">
          <div class="avatar">${initials}</div>
          <div style="flex:1;">
            <div class="person-name">${p.firstName} ${p.lastName}</div>
            <div class="person-dates">${span}</div>
          </div>
        </div>
        ${p.birthPlace?`<div class="person-meta">📍 ${p.birthPlace}</div>`:''}
        ${p.occupation?`<div class="person-meta">💼 ${p.occupation}</div>`:''}
      </div>`;
    }).join('');
  },

  showPersonDetail(id){
    const p=this.persons.find(x=>x.id===id);
    if(!p) return;
    this.currentId=id;
    document.getElementById('modalTitle').textContent=this.personLabel(p);
    const father=this.persons.find(x=>x.id===p.fatherId);
    const mother=this.persons.find(x=>x.id===p.motherId);
    const children=this.persons.filter(x=>x.fatherId===p.id || x.motherId===p.id);
    let html='';

    html+=`<div class="detail-section">
      <div class="detail-label">Geburt</div>
      <div class="detail-value">${p.birthDate||'–'}${p.birthPlace?` in ${p.birthPlace}`:''}</div>
    </div>`;

    if(p.baptismDate || p.baptismPlace){
      html+=`<div class="detail-section">
        <div class="detail-label">Taufe</div>
        <div class="detail-value">${p.baptismDate||'–'}${p.baptismPlace?` in ${p.baptismPlace}`:''}</div>
      </div>`;
    }

    if(p.deathDate || p.deathPlace){
      html+=`<div class="detail-section">
        <div class="detail-label">Tod</div>
        <div class="detail-value">${p.deathDate||'–'}${p.deathPlace?` in ${p.deathPlace}`:''}</div>
      </div>`;
    }

    if(p.burialDate || p.burialPlace){
      html+=`<div class="detail-section">
        <div class="detail-label">Beerdigung</div>
        <div class="detail-value">${p.burialDate||'–'}${p.burialPlace?` in ${p.burialPlace}`:''}</div>
      </div>`;
    }

    if(p.partnerships && p.partnerships.length>0){
      html+=`<div class="detail-section">
        <div class="detail-label">Partnerschaften / Ehen</div>
        <div class="detail-value">`;
      p.partnerships.forEach((ps,idx)=>{
        const partner=this.persons.find(x=>x.id===ps.partnerId);
        html+=`<div style="margin-bottom:var(--space-2);">`;
        html+=`${idx+1}. `;
        if(partner){
          html+=`<span class="chip" onclick="app.showPersonDetail(${partner.id})">${this.personLabel(partner)}</span>`;
        }else{
          html+=`Partner unbekannt`;
        }
        if(ps.date || ps.place){
          html+=`<br><small style="color:var(--color-text-muted);">Heirat: ${ps.date||'–'}${ps.place?` in ${ps.place}`:''}</small>`;
        }
        html+=`</div>`;
      });
      html+=`</div></div>`;
    }

    if(p.occupation){
      html+=`<div class="detail-section">
        <div class="detail-label">Beruf</div>
        <div class="detail-value">${p.occupation}</div>
      </div>`;
    }

    if(father || mother){
      html+=`<div class="detail-section">
        <div class="detail-label">Eltern${p.illegitimate?' (unehelich)':''}</div>
        <div class="detail-value">`;
      if(father) html+=`👨 <span class="chip" onclick="app.showPersonDetail(${father.id})">${this.personLabel(father)}</span><br>`;
      if(mother) html+=`👩 <span class="chip" onclick="app.showPersonDetail(${mother.id})">${this.personLabel(mother)}</span>`;
      html+='</div></div>';
    }

    if(children.length){
      html+=`<div class="detail-section">
        <div class="detail-label">Kinder</div>
        <div class="detail-value chips">
          ${children.map(c=>`<span class="chip" onclick="app.showPersonDetail(${c.id})">${this.personLabel(c)}${c.illegitimate?' (unehel.)':''}</span>`).join('')}
        </div>
      </div>`;
    }

    if(p.notes){
      html+=`<div class="detail-section">
        <div class="detail-label">Notizen / Quellen</div>
        <div class="detail-value">${p.notes.replace(/\n/g,'<br>')}</div>
      </div>`;
    }

    document.getElementById('modalBody').innerHTML=html;
    document.getElementById('personModal').classList.add('active');
  },

  closeModal(){ document.getElementById('personModal').classList.remove('active'); },

  buildForms(){
    const baseFields = (prefix='')=>`
      <div class="form-row">
        <div class="form-group">
          <label>Vorname *</label>
          <input name="${prefix}firstName" required>
        </div>
        <div class="form-group">
          <label>Nachname *</label>
          <input name="${prefix}lastName" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Geschlecht *</label>
          <select name="${prefix}gender" required>
            <option value="M">Männlich</option>
            <option value="F">Weiblich</option>
          </select>
        </div>
        <div class="form-group">
          <label>Beruf</label>
          <input name="${prefix}occupation">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Geburtsdatum</label>
          <input type="text" name="${prefix}birthDate" placeholder="z.B. 1830, vor 1831, um 1850">
        </div>
        <div class="form-group">
          <label>Geburtsort</label>
          <input name="${prefix}birthPlace">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Taufdatum</label>
          <input type="text" name="${prefix}baptismDate" placeholder="z.B. 1850 oder um 1850">
        </div>
        <div class="form-group">
          <label>Taufort</label>
          <input name="${prefix}baptismPlace">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Todesdatum</label>
          <input type="text" name="${prefix}deathDate" placeholder="z.B. 12.03.1899 oder vor 1831">
        </div>
        <div class="form-group">
          <label>Todesort</label>
          <input name="${prefix}deathPlace">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Beerdigungsdatum</label>
          <input type="text" name="${prefix}burialDate" placeholder="z.B. 1899 oder nach 1895">
        </div>
        <div class="form-group">
          <label>Beerdigungsort</label>
          <input name="${prefix}burialPlace">
        </div>
      </div>
      <div class="form-group">
        <label>Partnerschaften / Ehen</label>
        <div id="${prefix}partnershipsList"></div>
        <button type="button" class="btn btn-small btn-secondary" onclick="app.addPartnershipField('${prefix}')">+ Partnerschaft</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Vater</label>
          <select name="${prefix}fatherId">
            <option value="">– keiner –</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mutter</label>
          <select name="${prefix}motherId">
            <option value="">– keine –</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" name="${prefix}illegitimate">
          <span>Kind unehelich / außerehelich</span>
        </label>
      </div>
      <div class="form-group">
        <label>Notizen / Quellen</label>
        <textarea name="${prefix}notes"></textarea>
      </div>`;

    document.getElementById('addPersonForm').innerHTML=baseFields()+
      '<button class="btn" style="width:100%;margin-top:var(--space-4);">Speichern</button>';
    document.getElementById('editPersonForm').innerHTML=baseFields('e_')+
      '<button class="btn" style="width:100%;margin-top:var(--space-4);">Änderungen speichern</button>';

    document.getElementById('addPersonForm').onsubmit=e=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      const p=this.formToPerson(fd,'');
      this.persons.push(p);
      this.saveAll().then(()=>this.renderPersons());
      this.closeAddModal();
    };

    document.getElementById('editPersonForm').onsubmit=e=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      const updated=this.formToPerson(fd,'e_');
      const idx=this.persons.findIndex(x=>x.id===this.currentId);
      if(idx>-1){
        updated.id=this.currentId;
        this.persons[idx]=updated;
        this.saveAll().then(()=>this.renderPersons());
      }
      this.closeEditModal();
      this.closeModal();
    };
  },

  addPartnershipField(prefix){
    const list=document.getElementById(`${prefix}partnershipsList`);
    const idx=list.children.length;
    const div=document.createElement('div');
    div.className='partnership-item';
    div.innerHTML=`
      <div class="partnership-header">
        <strong>Partnerschaft ${idx+1}</strong>
        <button type="button" class="btn btn-small btn-danger" onclick="this.parentElement.parentElement.remove()">×</button>
      </div>
      <div class="form-group" style="margin-bottom:var(--space-2);">
        <label style="font-size:var(--text-xs);">Partner/in</label>
        <select name="${prefix}partner_${idx}">
          <option value="">– auswählen –</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0;">
          <label style="font-size:var(--text-xs);">Heiratsdatum</label>
          <input type="text" name="${prefix}partnerDate_${idx}" placeholder="z.B. 1875">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label style="font-size:var(--text-xs);">Heiratsort</label>
          <input type="text" name="${prefix}partnerPlace_${idx}">
        </div>
      </div>`;
    list.appendChild(div);
    this.populatePartnerSelect(prefix,idx);
  },

  populatePartnerSelect(prefix,idx){
    const sel=document.querySelector(`select[name="${prefix}partner_${idx}"]`);
    if(!sel) return;
    const opts=this.persons.map(p=>`<option value="${p.id}">${this.personLabel(p)}</option>`).join('');
    sel.innerHTML='<option value="">– auswählen –</option>'+opts;
  },

  formToPerson(fd,prefix){
    const get=n=>fd.get(prefix+n)||'';
    const num=n=>{const v=fd.get(prefix+n);return v?Number(v):null;};
    const p={
      firstName:get('firstName'),
      lastName:get('lastName'),
      gender:get('gender')||'U',
      occupation:get('occupation')||null,
      birthDate:get('birthDate')||null,
      birthPlace:get('birthPlace')||null,
      baptismDate:get('baptismDate')||null,
      baptismPlace:get('baptismPlace')||null,
      deathDate:get('deathDate')||null,
      deathPlace:get('deathPlace')||null,
      burialDate:get('burialDate')||null,
      burialPlace:get('burialPlace')||null,
      notes:get('notes')||null,
      partnerships:[]
    };
    const fid=num('fatherId'); if(fid) p.fatherId=fid;
    const mid=num('motherId'); if(mid) p.motherId=mid;
    p.illegitimate=fd.get(prefix+'illegitimate')==='on';

    let i=0;
    while(fd.has(`${prefix}partner_${i}`)){
      const pid=num(`partner_${i}`);
      if(pid){
        p.partnerships.push({
          partnerId:pid,
          date:get(`partnerDate_${i}`)||null,
          place:get(`partnerPlace_${i}`)||null
        });
      }
      i++;
    }
    return p;
  },

  populateParentSelects(prefix=''){
    const f=document.querySelector(`select[name="${prefix}fatherId"]`);
    const m=document.querySelector(`select[name="${prefix}motherId"]`);
    if(!f || !m) return;
    const opts=this.persons.map(p=>`<option value="${p.id}">${this.personLabel(p)}</option>`).join('');
    f.innerHTML='<option value="">– keiner –</option>'+opts;
    m.innerHTML='<option value="">– keine –</option>'+opts;
  },

  showAddModal(){
    this.populateParentSelects('');
    document.getElementById('addPersonForm').reset();
    document.getElementById('partnershipsList').innerHTML='';
    document.getElementById('addModal').classList.add('active');
  },
  closeAddModal(){ document.getElementById('addModal').classList.remove('active'); },

  startEdit(){
    const p=this.persons.find(x=>x.id===this.currentId);
    if(!p) return;
    this.populateParentSelects('e_');
    const f=document.getElementById('editPersonForm');
    f.elements['e_firstName'].value=p.firstName||'';
    f.elements['e_lastName'].value=p.lastName||'';
    f.elements['e_gender'].value=p.gender||'U';
    f.elements['e_occupation'].value=p.occupation||'';
    f.elements['e_birthDate'].value=p.birthDate||'';
    f.elements['e_birthPlace'].value=p.birthPlace||'';
    f.elements['e_baptismDate'].value=p.baptismDate||'';
    f.elements['e_baptismPlace'].value=p.baptismPlace||'';
    f.elements['e_deathDate'].value=p.deathDate||'';
    f.elements['e_deathPlace'].value=p.deathPlace||'';
    f.elements['e_burialDate'].value=p.burialDate||'';
    f.elements['e_burialPlace'].value=p.burialPlace||'';
    f.elements['e_notes'].value=p.notes||'';
    f.elements['e_fatherId'].value=p.fatherId||'';
    f.elements['e_motherId'].value=p.motherId||'';
    f.elements['e_illegitimate'].checked=p.illegitimate||false;

    const list=document.getElementById('e_partnershipsList');
    list.innerHTML='';
    if(p.partnerships && p.partnerships.length>0){
      p.partnerships.forEach((ps,idx)=>{
        this.addPartnershipField('e_');
        setTimeout(()=>{
          const sel=document.querySelector(`select[name="e_partner_${idx}"]`);
          const dateInp=document.querySelector(`input[name="e_partnerDate_${idx}"]`);
          const placeInp=document.querySelector(`input[name="e_partnerPlace_${idx}"]`);
          if(sel) sel.value=ps.partnerId||'';
          if(dateInp) dateInp.value=ps.date||'';
          if(placeInp) placeInp.value=ps.place||'';
        },10);
      });
    }

    document.getElementById('editModal').classList.add('active');
  },
  closeEditModal(){ document.getElementById('editModal').classList.remove('active'); },

  deleteCurrent(){
    if(!this.currentId) return;
    if(!confirm('Diese Person wirklich löschen?')) return;
    this.persons=this.persons.filter(p=>p.id!==this.currentId);
    this.persons.forEach(p=>{
      if(p.fatherId===this.currentId) delete p.fatherId;
      if(p.motherId===this.currentId) delete p.motherId;
      if(p.partnerships){
        p.partnerships=p.partnerships.filter(ps=>ps.partnerId!==this.currentId);
      }
    });
    this.saveAll().then(()=>this.renderPersons());
    this.closeModal();
  },

  searchPersons(q){
    if(!q){ this.renderPersons(); return; }
    const needle=q.toLowerCase();
    const res=this.persons.filter(p=>{
      const s=`${p.firstName} ${p.lastName} ${p.birthPlace||''} ${p.occupation||''} ${(p.notes||'')}`.toLowerCase();
      return s.includes(needle);
    });
    this.renderPersons(res);
  },

  switchView(ev,view){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    ev.target.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(view+'View').classList.add('active');
    if(view==='timeline') this.renderTimeline();
    if(view==='stats') this.renderStats();
    if(view==='tree') this.renderTree();
  },

  renderTimeline(){
    const events=[];
    this.persons.forEach(p=>{
      if(p.birthDate) events.push({t:'birth',date:p.birthDate,p});
      if(p.baptismDate) events.push({t:'baptism',date:p.baptismDate,p});
      if(p.partnerships){
        p.partnerships.forEach(ps=>{
          if(ps.date) events.push({t:'marriage',date:ps.date,p,partnerId:ps.partnerId});
        });
      }
      if(p.deathDate) events.push({t:'death',date:p.deathDate,p});
      if(p.burialDate) events.push({t:'burial',date:p.burialDate,p});
    });
    events.sort((a,b)=>{
      const parseDate=d=>{
        if(/^\d{4}$/.test(d)) return new Date(d+'-01-01');
        if(/^\d{4}-\d{2}$/.test(d)) return new Date(d+'-01');
        return new Date(d);
      };
      return parseDate(a.date)-parseDate(b.date);
    });
    const decades={};
    events.forEach(e=>{
      const y=e.date.match(/\d{4}/)?.[0];
      if(!y) return;
      const d=Math.floor(y/10)*10;
      (decades[d]||(decades[d]=[])).push(e);
    });
    const label=t=>({
      birth:'👶 Geboren',
      baptism:'🕊️ Getauft',
      marriage:'💍 Geheiratet',
      death:'✝️ Gestorben',
      burial:'⚰️ Beerdigt'
    }[t]||'');
    const html=Object.keys(decades).sort().map(d=>`
      <div class="timeline-group">
        <div class="timeline-decade">${d}er Jahre</div>
        ${decades[d].map(e=>{
          let text=`<strong>${e.date}</strong> – ${label(e.t)}: ${this.personLabel(e.p)}`;
          if(e.t==='marriage' && e.partnerId){
            const partner=this.persons.find(x=>x.id===e.partnerId);
            if(partner) text+=` mit ${this.personLabel(partner)}`;
          }
          if(e.t==='birth' && e.p.birthPlace) text+=` in ${e.p.birthPlace}`;
          return `<div class="timeline-event" onclick="app.showPersonDetail(${e.p.id})">${text}</div>`;
        }).join('')}
      </div>`).join('');
    document.getElementById('timelineContent').innerHTML=html || '<div class="empty-state"><p>Keine Ereignisse vorhanden</p></div>';
  },

  renderStats(){
    const stats=[
      {label:'Personen gesamt',value:this.persons.length},
      {label:'Männer',value:this.persons.filter(p=>p.gender==='M').length},
      {label:'Frauen',value:this.persons.filter(p=>p.gender==='F').length},
      {label:'Mit Geburtsdatum',value:this.persons.filter(p=>p.birthDate).length},
      {label:'Mit Taufdatum',value:this.persons.filter(p=>p.baptismDate).length},
      {label:'Mit Ehe/Partnerschaft',value:this.persons.filter(p=>p.partnerships&&p.partnerships.length>0).length},
      {label:'Uneheliche Kinder',value:this.persons.filter(p=>p.illegitimate).length}
    ];
    const places={};
    this.persons.forEach(p=>{ if(p.birthPlace) places[p.birthPlace]=(places[p.birthPlace]||0)+1; });
    const topPlaces=Object.entries(places).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([place,count])=>({label:place,value:count}));
    document.getElementById('statsContent').innerHTML=
      stats.concat(topPlaces).map(s=>`
        <div class="stat-card">
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>`).join('');
  },

  renderTree(){
    if(!this.persons.length){
      document.getElementById('treeContent').innerHTML='<div class="empty-state"><p>Keine Personen für den Stammbaum</p></div>';
      return;
    }
    const roots=this.persons.filter(p=>!p.fatherId && !p.motherId)
      .sort((a,b)=>{
        const ya=a.birthDate?.match(/\d{4}/)?.[0]||'9999';
        const yb=b.birthDate?.match(/\d{4}/)?.[0]||'9999';
        return ya-yb;
      });
    const root=roots[0] || this.persons[0];

    const levels=[];
    function addLevel(persons,level){
      if(!persons.length) return;
      levels[level]=persons;
      const children=[];
      persons.forEach(p=>{
        app.persons.forEach(c=>{
          if(c.fatherId===p.id || c.motherId===p.id) children.push(c);
        });
      });
      const uniq=[...new Map(children.map(c=>[c.id,c])).values()];
      if(uniq.length) addLevel(uniq,level+1);
    }
    addLevel([root],0);

    const html=levels.map((persons,idx)=>`
      <div class="tree-links">${idx===0?'Stammvater':'↓ Kinder-Generation ' + (idx+1)}</div>
      <div class="tree-level">
        ${persons.map(p=>{
          const by=p.birthDate||'?';
          const dy=p.deathDate||'';
          const span=dy?`${by}–${dy}`:`*${by}`;
          return `
            <div class="tree-node" onclick="app.showPersonDetail(${p.id})">
              <div class="tree-name">${this.personLabel(p)}${p.illegitimate?' (unehel.)':''}</div>
              <div class="tree-years">${span}</div>
              ${p.birthPlace?`<div class="person-meta">📍 ${p.birthPlace}</div>`:''}
            </div>`;
        }).join('')}
      </div>`).join('');
    document.getElementById('treeContent').innerHTML=html;
  },

  exportJSON(){
    const data=JSON.stringify(this.persons,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='familie-van-dahl-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  async importJSON(ev){
    const file=ev.target.files[0]; if(!file) return;
    try{
      const text=await file.text();
      const imported=JSON.parse(text);
      if(confirm(`${imported.length} Personen importieren? Vorhandene Daten werden überschrieben.`)){
        this.persons=imported;
        await this.saveAll();
        await this.loadData();
        this.renderPersons();
      }
    }catch(err){ alert('Fehler beim Importieren: '+err.message); }
    ev.target.value='';
  },

  showStorageStatus(){
    const s=document.getElementById('storageStatus');
    s.classList.add('show');
    setTimeout(()=>s.classList.remove('show'),2000);
  },

  initTheme(){
    const t=document.querySelector('[data-theme-toggle]');
    const root=document.documentElement;
    let theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    root.setAttribute('data-theme',theme);
    t.addEventListener('click',()=>{
      theme=theme==='dark'?'light':'dark';
      root.setAttribute('data-theme',theme);
    });
  }
};

document.addEventListener('DOMContentLoaded',()=>app.init());
</script>
</body>
</html>
